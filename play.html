<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISMS 動畫互動課</title>
<meta name="description" content="ISO/IEC 27001:2022 動畫互動課：Allan 講師（台灣男聲）與助教阿拉蕾（台灣小女生）語音導讀，黑板動畫逐步講解，含隨堂測驗。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=LXGW+WenKai+TC&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/play.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><b>ISMS 動畫互動課</b><span>ISO/IEC 27001:2022 · Allan Lo</span></a>
  <div class="grow"></div>
  <a class="btn small" href="index.html" id="readLink">閱讀版</a>
  <a class="btn small primary" href="index.html#quiz" id="quizLink">課後測驗</a>
</header>
<main class="play-main">
  <div class="play-wrap">
    <div class="play-head">
      <div><div class="eyebrow" id="chapEyebrow">單元</div><h1 id="chapTitle">載入中…</h1></div>
      <span class="note" id="chapSub"></span>
    </div>

    <section class="stage" id="stage" aria-label="動畫教室">
      <div class="actor R quiet" id="actorR">
        <span class="name">助教 阿拉蕾</span>
        <div class="frame"><img src="assets/arale.webp" alt="助教阿拉蕾" width="375" height="540"></div>
        <div class="waves" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
      <div class="board" id="board" aria-live="polite"></div>
      <div class="actor A quiet" id="actorA">
        <span class="name">講師 Allan</span>
        <div class="frame"><img src="assets/allan.webp" alt="Allan 講師" width="570" height="1000"></div>
        <div class="waves" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
      <div class="bubble-zone"><div class="speech R" id="speech"><span class="who" id="speechWho">阿拉蕾</span><span class="txt" id="speechTxt"></span></div></div>
      <div class="cover" id="cover">
        <h2 id="coverTitle">準備好上課了嗎？</h2>
        <p id="coverText">講師 Allan（台灣男聲）與助教阿拉蕾（台灣小女生）會用語音帶你一步一步讀懂 ISO 27001。請開啟喇叭或戴上耳機。</p>
        <button class="big-play" id="coverPlay" aria-label="開始播放">▶</button>
      </div>
    </section>

    <section class="controls" aria-label="播放控制">
      <div class="timeline" id="timeline" role="slider" aria-label="播放進度" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="track"></div><div class="fill" id="tlFill"></div><div id="tlTicks"></div><div class="knob" id="tlKnob"></div>
      </div>
      <div class="ctl-row">
        <button class="ctl" id="btnPrev" title="上一句（←）" aria-label="上一句">⏮</button>
        <button class="ctl play" id="btnPlay" title="播放／暫停（空白鍵）" aria-label="播放">▶</button>
        <button class="ctl" id="btnNext" title="下一句（→）" aria-label="下一句">⏭</button>
        <span class="time" id="timeText">0:00 / 0:00</span>
        <span class="grow"></span>
        <label class="hide-sm note" for="speed">語速</label>
        <select id="speed" aria-label="語速"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option></select>
        <button class="ctl on" id="btnSub" aria-pressed="true" title="字幕">字幕</button>
        <button class="ctl on" id="btnAuto" aria-pressed="true" title="自動播放下一章">連播</button>
      </div>
      <p class="mode-note" id="modeNote"></p>
    </section>

    <div class="lower">
      <section class="panel"><h2>本章字幕稿</h2><div class="transcript" id="transcript"></div></section>
      <section class="panel"><h2>選擇章節</h2><div class="chap-list" id="chapList"></div></section>
    </div>
  </div>
</main>

<script src="js/content-1.js"></script>
<script src="js/content-2.js"></script>
<script src="js/content-3.js"></script>
<script src="js/play-script.js"></script>
<script src="audio/cues.js"></script>
<script src="js/play.js"></script>
</body>
</html>
